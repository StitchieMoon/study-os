<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Forgot Password | Study OS
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f4f3ff;

            display: flex;

            align-items: center;

            justify-content: center;

            color: #222;

        }

        .container {

            width: 420px;

            max-width:
                calc(100% - 32px);

            background: white;

            border-radius: 22px;

            padding: 42px;

            box-shadow:
                0 15px 45px
                rgba(
                    0,
                    0,
                    0,
                    0.10
                );

        }

        .logo {

            text-align: center;

            font-size: 30px;

            font-weight: 700;

            color: #6c63ff;

            margin-bottom: 8px;

        }

        h1 {

            text-align: center;

            font-size: 25px;

            margin:
                0
                0
                15px;

        }

        p {

            text-align: center;

            color: #777;

            margin-bottom: 28px;

        }

        label {

            display: block;

            font-size: 14px;

            font-weight: 600;

            margin-bottom: 7px;

        }

        input {

            width: 100%;

            padding:
                13px
                14px;

            border:
                1px
                solid
                #ddd;

            border-radius: 10px;

            font-size: 15px;

            margin-bottom: 18px;

        }

        button {

            width: 100%;

            border: none;

            background: #6c63ff;

            color: white;

            padding: 14px;

            border-radius: 10px;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

        }

        .message {

            padding:
                11px
                13px;

            border-radius: 9px;

            margin-bottom: 18px;

            background: #fff0f0;

            color: #b42318;

        }

        .bottom {

            text-align: center;

            margin-top: 22px;

        }

        a {

            color: #6c63ff;

            text-decoration: none;

            font-weight: 600;

        }

    </style>

</head>


<body>


<div class="container">

    <div class="logo">
        Study OS
    </div>


    <h1>
        Reset your password
    </h1>


    <p>
        Enter the email associated with your account.
    </p>


    {% with messages = get_flashed_messages(with_categories=true) %}

        {% if messages %}

            {% for category, message in messages %}

                <div class="message">

                    {{ message }}

                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <form method="POST">


        <label for="email">

            Email

        </label>


        <input

            type="email"

            id="email"

            name="email"

            placeholder="you@example.com"

            required

        >


        <button type="submit">

            Continue

        </button>


    </form>


    <div class="bottom">

        <a href="{{ url_for('login') }}">

            Back to login

        </a>

    </div>


</div>


</body>

</html>
