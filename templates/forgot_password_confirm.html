<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="csrf-token" content="{{ csrf_token() }}">
<script src="{{ url_for('static', filename='csrf.js') }}"></script>
<title>Confirm your email | SmartStride</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:#f4f3ff;display:flex;align-items:center;justify-content:center;color:#222}
.container{width:440px;max-width:calc(100% - 32px);background:#fff;border-radius:22px;padding:38px;box-shadow:0 15px 45px rgba(0,0,0,.10)}
.logo{text-align:center;font-size:28px;font-weight:800;letter-spacing:-.03em;margin-bottom:6px}
.sub{text-align:center;color:#70747d;font-size:13px;line-height:1.6;margin:0 0 24px}
h1{font-size:20px;margin:0 0 8px;letter-spacing:-.02em}
.hint{font-size:12px;color:#70747d;line-height:1.6;margin:0 0 16px}
.mask{display:block;text-align:center;font-size:20px;font-weight:850;letter-spacing:.08em;background:#f7f5ff;border:1px dashed #c4b5fd;border-radius:12px;padding:14px 10px;margin:0 0 18px;color:#4c1d95}
label{display:block;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#555962;margin-bottom:14px}
input{display:block;width:100%;margin-top:6px;padding:12px 13px;border:1px solid #dfe1e8;border-radius:10px;font:inherit;font-size:14px}
button{width:100%;padding:13px;border:0;border-radius:11px;background:#6c63ff;color:#fff;font:inherit;font-size:14px;font-weight:800;cursor:pointer;margin-top:4px}
.error{background:#fef2f2;border:1px solid #fecaca;color:#b42318;border-radius:9px;padding:9px 11px;font-size:12px;margin-bottom:14px}
.back{display:block;text-align:center;margin-top:16px;font-size:12px;color:#6c63ff;text-decoration:none}
</style>
</head>
<body>
<div class="container">
  <div class="logo">SMARTSTRIDE</div>
  <p class="sub">Confirm your email to continue</p>
  <h1>Complete the email address</h1>
  <p class="hint">We show the first two and last five characters. Type the full email to prove it is yours.</p>
  <strong class="mask">{{ masked_email }}</strong>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="POST" action="{{ url_for('forgot_password_confirm') }}">
    <label>Full email<input type="email" name="email" required autocomplete="email" autofocus placeholder="you@example.com"></label>
    <button type="submit">Continue to new password</button>
  </form>
  <a class="back" href="{{ url_for('forgot_password') }}">← Start again</a>
</div>
</body>
</html>
