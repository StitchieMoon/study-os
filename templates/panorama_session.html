<script>

const studyMinutes = {{ panorama.study_length }};
const breakMinutes = {{ panorama.break_length }};
const totalCycles = {{ panorama.cycles }};

const studyMusicName =
    {{ panorama.study_music | default('No music', true) | tojson }};

const breakMusicName =
    {{ panorama.break_music | default('No music', true) | tojson }};


let currentCycle = 1;
let mode = "study";
let running = false;
let interval = null;
let sessionStarted = false;

let secondsRemaining = studyMinutes * 60;


const timer =
    document.getElementById("timer");

const modeLabel =
    document.getElementById("modeLabel");

const progress =
    document.getElementById("progress");

const musicLabel =
    document.getElementById("musicLabel");

const startButton =
    document.getElementById("startButton");

const pauseButton =
    document.getElementById("pauseButton");

const skipButton =
    document.getElementById("skipButton");

const studyMusic =
    document.getElementById("studyMusic");

const breakMusic =
    document.getElementById("breakMusic");

const bell =
    document.getElementById("bell");


function updateTimer() {

    const minutes =
        Math.floor(secondsRemaining / 60);

    const seconds =
        secondsRemaining % 60;

    timer.textContent =
        `${minutes}:${
            seconds
                .toString()
                .padStart(2, "0")
        }`;

}


function stopMusic() {

    studyMusic.pause();
    breakMusic.pause();

}


function playStudyMusic() {

    stopMusic();

    if (
        !studyMusic ||
        !studyMusic.src ||
        studyMusic.src === window.location.href
    ) {
        console.log("No study music available.");
        return;
    }

    studyMusic.play()
        .catch(error => {
            console.error(
                "Study music could not play:",
                error
            );
        });

}


function playBreakMusic() {

    stopMusic();

    if (
        !breakMusic ||
        !breakMusic.src ||
        breakMusic.src === window.location.href
    ) {
        console.log("No break music available.");
        return;
    }

    breakMusic.play()
        .catch(error => {
            console.error(
                "Break music could not play:",
                error
            );
        });

}


function playBell() {

    if (!bell) {
        return;
    }

    bell.currentTime = 0;

    bell.play()
        .catch(error => {
            console.log(
                "Bell could not play:",
                error
            );
        });

}


function setStudyMode(resetTimer = false) {

    mode = "study";

    document.body.classList.remove(
        "break-mode"
    );

    document.body.classList.remove(
        "complete-mode"
    );

    document.body.classList.add(
        "study-mode"
    );

    modeLabel.textContent =
        "Study";

    if (resetTimer) {

        secondsRemaining =
            studyMinutes * 60;

    }

    musicLabel.textContent =
        `Study music: ${
            studyMusicName || "No music"
        }`;

    updateTimer();

}


function setBreakMode() {

    mode = "break";

    document.body.classList.remove(
        "study-mode"
    );

    document.body.classList.remove(
        "complete-mode"
    );

    document.body.classList.add(
        "break-mode"
    );

    modeLabel.textContent =
        "Break";

    secondsRemaining =
        breakMinutes * 60;

    musicLabel.textContent =
        `Break music: ${
            breakMusicName || "No music"
        }`;

    updateTimer();

}


function completeSession() {

    clearInterval(interval);

    running = false;

    stopMusic();

    document.body.classList.remove(
        "study-mode"
    );

    document.body.classList.remove(
        "break-mode"
    );

    document.body.classList.add(
        "complete-mode"
    );

    modeLabel.textContent =
        "Completed";

    timer.textContent =
        "Done";

    progress.textContent =
        "Panorama session complete";

    musicLabel.textContent =
        "Session finished";

    playBell();

}


function startTimer() {

    if (running) {
        return;
    }

    running = true;

    startButton.textContent =
        "Running";

    if (mode === "study") {

        playStudyMusic();

    } else {

        playBreakMusic();

    }

    interval =
        setInterval(
            tick,
            1000
        );

}


function pauseTimer() {

    if (!running) {
        return;
    }

    running = false;

    clearInterval(interval);

    interval = null;

    stopMusic();

    startButton.textContent =
        "Resume";

}


function startBreak() {

    clearInterval(interval);

    interval = null;

    setBreakMode();

    playBell();

    if (breakMinutes <= 0) {

        nextCycle();

        return;

    }

    if (running) {

        playBreakMusic();

        interval =
            setInterval(
                tick,
                1000
            );

    }

}


function nextCycle() {

    if (
        currentCycle >= totalCycles
    ) {

        completeSession();

        return;

    }

    currentCycle += 1;

    progress.textContent =
        `Cycle ${
            currentCycle
        } of ${
            totalCycles
        }`;

    setStudyMode(true);

    playBell();

    if (running) {

        playStudyMusic();

        clearInterval(interval);

        interval =
            setInterval(
                tick,
                1000
            );

    }

}


function tick() {

    if (secondsRemaining > 0) {

        secondsRemaining -= 1;

        updateTimer();

        return;

    }


    if (mode === "study") {

        startBreak();

    } else {

        nextCycle();

    }

}


startButton.addEventListener(
    "click",
    function() {

        if (!sessionStarted) {

            sessionStarted = true;

            setStudyMode(false);

        }

        startTimer();

    }
);


pauseButton.addEventListener(
    "click",
    function() {

        pauseTimer();

    }
);


skipButton.addEventListener(
    "click",
    function() {

        if (mode === "study") {

            startBreak();

        } else {

            nextCycle();

        }

    }
);


setStudyMode(false);

progress.textContent =
    `Cycle 1 of ${totalCycles}`;

</script>
