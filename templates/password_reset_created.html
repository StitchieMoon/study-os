<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Study OS | Password Reset</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f7f7fb;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            max-width: 600px;
            margin: 20px;
            padding: 32px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(40,40,80,.12);
        }

        h1 {
            margin-top: 0;
        }

        p {
            color: #666;
            line-height: 1.6;
        }

        .link {
            word-break: break-all;
            padding: 15px;
            background: #f3f2ff;
            border-radius: 12px;
            margin: 20px 0;
        }

        a {
            color: #5d54ee;
            font-weight: 700;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>Password reset</h1>

    <p>
        A password reset link has been created for your account.
    </p>

    <p>
        For this development version of Study OS, the reset link is shown here instead of being emailed.
    </p>

    <div class="link">
        <a href="{{ reset_url }}">
            {{ reset_url }}
        </a>
    </div>

    <p>
        This link expires after 30 minutes.
    </p>

</div>

</body>
</html>
