{% extends "base.html" %}
{% block title %}Verify email | SmartStride{% endblock %}
{% block content %}
<div class="settings-page">
<style>
.settings-page{max-width:640px;margin:0 auto;padding:4px 0 48px}
.settings-card{border:1px solid var(--line,#e4e7ec);border-radius:14px;background:var(--surface,#fff);padding:22px 24px}
.settings-card h1{font-size:24px;margin:0 0 6px;letter-spacing:-.03em}
.settings-card p{font-size:12px;line-height:1.6;opacity:.68;margin:0 0 16px}
.settings-field{display:block;font-size:9px;letter-spacing:.07em;text-transform:uppercase;font-weight:800;opacity:.6;margin-bottom:12px}
.settings-field input{display:block;width:100%;margin-top:5px;padding:10px;border:1px solid var(--line-strong,#d0d5dd);border-radius:9px;background:transparent;color:inherit;font:inherit;font-size:14px;letter-spacing:.15em}
.settings-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.settings-btn{display:inline-flex;align-items:center;justify-content:center;padding:9px 13px;border:1px solid var(--line-strong,#d0d5dd);border-radius:9px;background:var(--surface,#fff);color:inherit;font:inherit;font-size:11px;font-weight:750;text-decoration:none;cursor:pointer}
.settings-btn.primary{background:var(--brand,#334155);border-color:var(--brand,#334155);color:#fff}
.settings-code{font-size:24px;font-weight:800;letter-spacing:.18em;padding:12px 14px;border:1px dashed var(--line-strong,#d0d5dd);border-radius:9px;background:rgba(127,127,127,.04);margin:0 0 14px}
</style>

<div class="settings-card">
    <h1>Verify your new email</h1>
    <p>Enter the verification code below.</p>
    <p class="settings-code">{{ session.get('email_change_code', '------') }}</p>
    <p>Enter the code to confirm <strong>{{ pending_email }}</strong>.</p>
    <form method="post" action="{{ url_for('verify_email_change') }}">
        <label class="settings-field">Verification code
            <input type="text" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="000000" required autofocus>
        </label>
        <div class="settings-actions">
            <button class="settings-btn primary" type="submit">Confirm email</button>
            <a class="settings-btn" href="{{ url_for('settings') }}">Cancel</a>
        </div>
    </form>
</div>
</div>
{% endblock %}
